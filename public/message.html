<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Promillo - Nachricht</title>
    <link rel="icon" type="image/png" href="assets/el-promillo-favicon-couple.png">
    <link rel="apple-touch-icon" href="assets/el-promillo-favicon-couple.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="message-layout">
      <section class="message-panel">
        <div class="wallet-message-topline">
          <div class="wallet-message-brand">
            <span class="wallet-message-brand-mark" aria-hidden="true"></span>
            <span>El Promillo</span>
          </div>
          <span id="messageCountBadge" class="wallet-message-badge" hidden>Neue Nachricht +1</span>
        </div>
        <p class="eyebrow">Cardinfo</p>
        <header class="wallet-message-header">
          <div>
            <h1 id="messageTitle">Nachricht</h1>
            <p id="messageMeta" class="muted">Wird geladen ...</p>
          </div>
        </header>

        <div id="messageNotice" class="message" hidden></div>

        <article id="messageCard" class="wallet-message-card" hidden>
          <div class="wallet-message-card-head">
            <span>Aktuelle Nachricht</span>
            <time id="messageSentAt">-</time>
          </div>
          <p id="messageBody" class="wallet-message-body"></p>
          <dl class="wallet-message-facts">
            <div>
              <dt>Unternehmen</dt>
              <dd id="messageBusiness">-</dd>
            </div>
            <div>
              <dt>Karte</dt>
              <dd id="messageCardName">-</dd>
            </div>
            <div>
              <dt>Karten-ID</dt>
              <dd id="messageCardCode">-</dd>
            </div>
          </dl>
        </article>

        <section id="messageHistorySection" class="wallet-message-history" hidden>
          <h2>Weitere Nachrichten</h2>
          <div id="messageHistory" class="stack"></div>
        </section>
      </section>

      <nav class="site-legal-links" aria-label="Rechtliches">
        <a href="datenschutz.html">Datenschutz</a>
        <a href="agb.html">AGB</a>
      </nav>
    </main>

    <script type="module" src="js/message.js"></script>
  </body>
</html>
